<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Weekly activity chart">
  <defs>
    <linearGradient id="ac-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#660000"/>
      <stop offset="1" stop-color="#FF0033"/>
    </linearGradient>
    <linearGradient id="ac-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="1192" height="252" rx="18" fill="url(#ac-card)" stroke="#FF0033" stroke-width="2" opacity="1"/>
  <text x="48" y="46" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="2" fill="#ffffff">WEEKLY ACTIVITY — BOSS BATTLES</text>
  <text x="1152" y="46" text-anchor="end" font-family="monospace" font-size="13" fill="#777777">ilustrasi ■ kontribusi asli di Snake / Pac-Man</text>
  <line x1="48" y1="60" x2="1152" y2="60" stroke="#333333" stroke-width="1"/>

  <g font-family="monospace" text-anchor="middle">
    <!-- MON -->
    <text x="150" y="86" font-size="13" font-weight="bold" fill="#FF4D5E">2</text>
    <rect x="118" y="94" width="64" height="70" rx="6" fill="url(#ac-bar)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="150" y="190" font-size="14" fill="#888888">MON</text>

    <!-- TUE -->
    <text x="300" y="104" font-size="13" font-weight="bold" fill="#FF4D5E">1</text>
    <rect x="268" y="112" width="64" height="52" rx="6" fill="url(#ac-bar)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text x="300" y="190" font-size="14" fill="#888888">TUE</text>

    <!-- WED -->
    <text x="450" y="86" font-size="13" font-weight="bold" fill="#FF4D5E">3</text>
    <rect x="418" y="94" width="64" height="70" rx="6" fill="url(#ac-bar)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="190" font-size="14" fill="#888888">WED</text>

    <!-- THU -->
    <text x="600" y="104" font-size="13" font-weight="bold" fill="#FF4D5E">1</text>
    <rect x="568" y="112" width="64" height="52" rx="6" fill="url(#ac-bar)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="190" font-size="14" fill="#888888">THU</text>

    <!-- FRI -->
    <text x="750" y="68" font-size="13" font-weight="bold" fill="#FF4D5E">5</text>
    <rect x="718" y="76" width="64" height="88" rx="6" fill="url(#ac-bar)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="190" font-size="14" fill="#888888">FRI</text>

    <!-- SAT -->
    <text x="900" y="104" font-size="13" font-weight="bold" fill="#FF4D5E">1</text>
    <rect x="868" y="112" width="64" height="52" rx="6" fill="url(#ac-bar)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="900" y="190" font-size="14" fill="#888888">SAT</text>

    <!-- SUN -->
    <text x="1050" y="86" font-size="13" font-weight="bold" fill="#FF4D5E">2</text>
    <rect x="1018" y="94" width="64" height="70" rx="6" fill="url(#ac-bar)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="1050" y="190" font-size="14" fill="#888888">SUN</text>

    <line x1="80" y1="164" x2="1120" y2="164" stroke="#333333" stroke-width="1"/>
  </g>

  <text x="600" y="228" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#777777">main tiap hari, commit tiap ada waktu — grind santai, bukan speedrun</text>
</svg>
