<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="ALJUDAN — Black and Red Arcade">
  <defs>
    <linearGradient id="hdr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.45" stop-color="#0a0a0a"/>
      <stop offset="0.75" stop-color="#1a0000"/>
      <stop offset="1" stop-color="#330000"/>
    </linearGradient>
    <linearGradient id="hdr-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF0033" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF0033" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF0033" stop-opacity="0"/>
    </linearGradient>
    <filter id="hdr-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hdr-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" fill="url(#hdr-bg)"/>
  <rect width="1200" height="220" fill="url(#hdr-scan)"/>

  <!-- sweeping light -->
  <rect x="-220" y="0" width="220" height="220" fill="url(#hdr-sweep)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1440 0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- neon frame -->
  <rect x="0" y="0" width="1200" height="3" fill="#FF0033"/>
  <rect x="0" y="217" width="1200" height="3" fill="#FF0033" opacity="0.85"/>

  <!-- blinking side coins -->
  <text x="42" y="62" font-family="monospace" font-size="22" fill="#FF0033">●
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <text x="1140" y="62" font-family="monospace" font-size="22" fill="#FF0033">●
    <animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <text x="42" y="165" font-family="monospace" font-size="13" fill="#555555">1UP</text>
  <text x="1118" y="165" font-family="monospace" font-size="13" fill="#555555">HI-0</text>

  <!-- title with red glow -->
  <text x="600" y="108" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="12" fill="#FF0033" opacity="0.6" filter="url(#hdr-glow)">ALJUDAN</text>
  <text x="600" y="108" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="12" fill="#ffffff">ALJUDAN</text>

  <!-- subtitle -->
  <text x="600" y="150" text-anchor="middle" font-family="monospace" font-size="17" letter-spacing="5" fill="#FF4D5E">▓▓▓ BLACK &amp; RED ARCADE ▓▓▓</text>

  <!-- bottom wave -->
  <path d="M0,192 C200,178 320,206 600,192 C880,180 1000,206 1200,190 L1200,220 L0,220 Z" fill="#FF0033" opacity="0.16"/>
  <text x="600" y="184" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="3" fill="#888888">PRESS START ■ BANDUNG, ID ■ EST. 2026</text>
</svg>
