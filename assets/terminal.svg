<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020202"/>
      <stop offset=".5" stop-color="#0d0206"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>

```
<linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#650014"/>
  <stop offset=".5" stop-color="#ff003c"/>
  <stop offset="1" stop-color="#650014"/>
</linearGradient>

<radialGradient id="ambient">
  <stop offset="0" stop-color="#ff003c" stop-opacity=".15"/>
  <stop offset="1" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>

<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40"
        fill="none"
        stroke="#ff003c"
        stroke-opacity=".055"/>
</pattern>

<pattern id="scanlines" width="1" height="8" patternUnits="userSpaceOnUse">
  <rect width="1" height="3" fill="#fff" opacity=".025"/>
</pattern>

<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<style>
  .blink {
    animation: blink 1s steps(2,end) infinite;
  }

  .slowBlink {
    animation: blink 2.5s steps(2,end) infinite;
  }

  .scan {
    animation: scan 5s linear infinite;
  }

  .cursor {
    animation: cursor 1s steps(2,end) infinite;
  }

  @keyframes blink {
    50% { opacity: .15; }
  }

  @keyframes scan {
    from { transform: translateY(-620px); }
    to { transform: translateY(620px); }
  }

  @keyframes cursor {
    50% { opacity: 0; }
  }

  text {
    font-family: monospace;
    letter-spacing: 1.5px;
  }
</style>
```

