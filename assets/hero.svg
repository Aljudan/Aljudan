<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020202"/>
    <stop offset="45%" stop-color="#080000"/>
    <stop offset="100%" stop-color="#180000"/>
  </linearGradient>

  <radialGradient id="crimsonGlow" cx="72%" cy="48%" r="48%">
    <stop offset="0%" stop-color="#c00000" stop-opacity=".34"/>
    <stop offset="35%" stop-color="#600000" stop-opacity=".20"/>
    <stop offset="70%" stop-color="#200000" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="coreGlow">
    <stop offset="0%" stop-color="#ff2020" stop-opacity=".65"/>
    <stop offset="30%" stop-color="#c00000" stop-opacity=".25"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="redLine">
    <stop offset="0%" stop-color="#3d0000" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ff2020"/>
    <stop offset="100%" stop-color="#3d0000" stop-opacity="0"/>
  </linearGradient>

  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M50 0H0V50"
          fill="none"
          stroke="#c00000"
          stroke-opacity=".08"
          stroke-width="1"/>
  </pattern>

  <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="#ffffff" opacity=".025"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="strongGlow">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>

    .orbitron {
      font-family: "Courier New", monospace;
      font-weight: 900;
      letter-spacing: 8px;
    }

    .mono {
      font-family: "Courier New", monospace;
      letter-spacing: 3px;
    }

    .tiny {
      font-family: "Courier New", monospace;
      letter-spacing: 2px;
    }

    .blink {
      animation: blink 2s infinite;
    }

    .pulse {
      animation: pulse 2.8s infinite;
    }

    .float {
      animation: float 4s ease-in-out infinite;
    }

    .rotate {
      transform-box: fill-box;
      transform-origin: center;
      animation: rotate 14s linear infinite;
    }

    .reverseRotate {
      transform-box: fill-box;
      transform-origin: center;
      animation: reverseRotate 9s linear infinite;
    }

    .glitch1 {
      animation: glitch1 3s infinite;
    }

    .glitch2 {
      animation: glitch2 2.5s infinite;
    }

    .flicker {
      animation: flicker 5s infinite;
    }

    .particle {
      animation: particle 4s ease-in-out infinite;
    }

    .scan {
      animation: scan 6s linear infinite;
    }

    @keyframes blink {
      0%, 45%, 100% { opacity: 1; }
      47%, 49% { opacity: .15; }
    }

    @keyframes pulse {
      0%, 100% { opacity: .35; }
      50% { opacity: .8; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes reverseRotate {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes glitch1 {
      0%, 88%, 100% {
        transform: translate(0,0);
        opacity: .25;
      }
      89% {
        transform: translate(-9px,2px);
        opacity: .7;
      }
      90% {
        transform: translate(8px,-2px);
        opacity: .4;
      }
      91% {
        transform: translate(-5px,0);
        opacity: .6;
      }
    }

    @keyframes glitch2 {
      0%, 84%, 100% {
        transform: translate(0,0);
        opacity: .2;
      }
      85% {
        transform: translate(8px,-2px);
        opacity: .7;
      }
      86% {
        transform: translate(-7px,3px);
        opacity: .4;
      }
      87% {
        transform: translate(3px,0);
        opacity: .5;
      }
    }

    @keyframes flicker {
      0%, 94%, 100% { opacity: 1; }
      95% { opacity: .3; }
      96% { opacity: 1; }
    }

    @keyframes particle {
      0%, 100% {
        opacity: .15;
        transform: translateY(0);
      }
      50% {
        opacity: .9;
        transform: translateY(-25px);
      }
    }

    @keyframes scan {
      from { transform: translateY(-900px); }
      to { transform: translateY(900px); }
    }

  </style>

</defs>

