<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="1600" height="850">
  <defs>

```
<!-- Background -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#030303"/>
  <stop offset="48%" stop-color="#090000"/>
  <stop offset="100%" stop-color="#160000"/>
</linearGradient>

<radialGradient id="redAura">
  <stop offset="0%" stop-color="#ff003c" stop-opacity=".45"/>
  <stop offset="45%" stop-color="#a00020" stop-opacity=".18"/>
  <stop offset="100%" stop-color="#000" stop-opacity="0"/>
</radialGradient>

<linearGradient id="redLine" x1="0" x2="1">
  <stop offset="0%" stop-color="#300008" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ff1744"/>
  <stop offset="100%" stop-color="#300008" stop-opacity="0"/>
</linearGradient>

<linearGradient id="hud" x1="0" x2="1">
  <stop offset="0%" stop-color="#ff003c"/>
  <stop offset="100%" stop-color="#8b001e"/>
</linearGradient>

<!-- Glow -->
<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="softGlow">
  <feGaussianBlur stdDeviation="20"/>
</filter>

<!-- Clip -->
<clipPath id="screen">
  <rect width="1600" height="850"/>
</clipPath>

<!-- Grid -->
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
  <path d="M50 0H0V50"
        fill="none"
        stroke="#ff003c"
        stroke-opacity=".09"
        stroke-width="1"/>
</pattern>

<!-- Scanlines -->
<pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
  <rect width="4" height="4" fill="#ff003c" opacity=".035"/>
</pattern>

<style>
  .mono {
    font-family: "Courier New", monospace;
    letter-spacing: 3px;
  }

  .small {
    font-family: "Courier New", monospace;
    font-size: 14px;
    letter-spacing: 3px;
  }

  .tiny {
    font-family: "Courier New", monospace;
    font-size: 10px;
    letter-spacing: 2px;
  }

  .red {
    fill: #ff1744;
  }

  .white {
    fill: #f4f4f4;
  }

  .dim {
    fill: #7f2737;
  }

  .line {
    stroke: #ff1744;
    fill: none;
  }

  .blink {
    animation: blink 1.8s infinite;
  }

  .pulse {
    animation: pulse 2.5s infinite;
  }

  .rotate {
    transform-box: fill-box;
    transform-origin: center;
    animation: rotate 12s linear infinite;
  }

  .reverseRotate {
    transform-box: fill-box;
    transform-origin: center;
    animation: rotateReverse 8s linear infinite;
  }

  .float {
    animation: float 4s ease-in-out infinite;
  }

  .glitchA {
    animation: glitchA 3.5s infinite;
  }

  .glitchB {
    animation: glitchB 2.8s infinite;
  }

  .flicker {
    animation: flicker 5s infinite;
  }

  @keyframes blink {
    0%, 45%, 48%, 100% { opacity: 1; }
    46%, 47% { opacity: .15; }
  }

  @keyframes pulse {
    0%,100% { opacity: .35; transform: scale(1); }
    50% { opacity: .75; transform: scale(1.04); }
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes rotateReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes glitchA {
    0%,88%,100% { transform: translate(0,0); opacity:.28; }
    89% { transform: translate(-8px,2px); opacity:.7; }
    90% { transform: translate(7px,-2px); opacity:.4; }
    91% { transform: translate(-4px,0); opacity:.7; }
  }

  @keyframes glitchB {
    0%,84%,100% { transform: translate(0,0); opacity:.2; }
    85% { transform: translate(9px,-3px); opacity:.6; }
    86% { transform: translate(-6px,3px); opacity:.4; }
    87% { transform: translate(3px,0); opacity:.5; }
  }

  @keyframes flicker {
    0%,95%,100% { opacity:1; }
    96% { opacity:.35; }
    97% { opacity:1; }
  }

  .particle {
    animation: particle 4s ease-in-out infinite;
  }

  @keyframes particle {
    0%,100% { opacity:.15; transform:translateY(0); }
    50% { opacity:.8; transform:translateY(-25px); }
  }
</style>
