```svg
<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900">
      <stop offset="0" stop-color="#020202"/>
      <stop offset="0.55" stop-color="#080101"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>

    <!-- Crimson glow -->
    <radialGradient id="redGlow">
      <stop offset="0" stop-color="#C00000" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#700000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Horizon glow -->
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D0000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C00000" stop-opacity=".75"/>
      <stop offset="1" stop-color="#3D0000" stop-opacity="0"/>
    </linearGradient>

    <!-- Text glow -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanlines -->
    <pattern id="scanlines" width="1600" height="8" patternUnits="userSpaceOnUse">
      <rect width="1600" height="4" fill="#FFFFFF" opacity=".025"/>
      <rect y="4" width="1600" height="4" fill="#000000" opacity=".22"/>
    </pattern>

    <!-- Grid -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" stroke="#8B0000" stroke-opacity=".13"/>
    </pattern>

    <!-- Vignette -->
    <radialGradient id="vignette">
      <stop offset=".35" stop-color="#000" stop-opacity="0"/>
      <stop offset=".78" stop-color="#000" stop-opacity=".32"/>
      <stop offset="1" stop-color="#000" stop-opacity=".92"/>
    </radialGradient>

    <!-- Clip for glitch slices -->
    <clipPath id="slice1">
      <rect x="0" y="330" width="1600" height="38"/>
    </clipPath>

    <clipPath id="slice2">
      <rect x="0" y="470" width="1600" height="26"/>
    </clipPath>

    <style>
      .mono {
        font-family: "Courier New", monospace;
      }

      .title {
        font-family: "Arial Black", "Arial", sans-serif;
        font-weight: 900;
        letter-spacing: 18px;
      }

      .small {
        font-family: "Courier New", monospace;
        font-size: 15px;
        letter-spacing: 4px;
      }

      .red {
        fill: #C00000;
      }

      .soft-red {
        fill: #8B0000;
      }

      .white {
        fill: #F2F2F2;
      }

      .dim {
        fill: #666;
      }

      @keyframes pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: 1; }
      }

      @keyframes scan {
        0% { transform: translateY(-900px); }
        100% { transform: translateY(900px); }
      }

      @keyframes flicker {
        0%, 18%, 22%, 63%, 64%, 65%, 100% { opacity: 1; }
        20%, 62% { opacity: .45; }
      }

      @keyframes glitch {
        0%, 90%, 100% {
          transform: translate(0);
        }
        91% {
          transform: translate(-8px, 2px);
        }
        92% {
          transform: translate(7px, -2px);
        }
        93% {
          transform: translate(-4px, 0);
        }
        94% {
          transform: translate(0);
        }
      }

      @keyframes drift {
        0% { transform: translateX(0); }
        50% { transform: translateX(18px); }
        100% { transform: translateX(0); }
      }

      @keyframes blink {
        0%, 45%, 100% { opacity: 1; }
        46%, 55% { opacity: .15; }
      }

      .pulse {
        animation: pulse 1.8s ease-in-out infinite;
      }

      .scan {
        animation: scan 7s linear infinite;
      }

      .flicker {
        animation: flicker 5s infinite;
      }

      .glitch {
        animation: glitch 4s infinite;
      }

      .drift {
        animation: drift 5s ease-in-out infinite;
      }

      .blink {
        animation: blink 1.4s infinite;
      }
    </style>
  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

