```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030303"/>
    <stop offset="55%" stop-color="#080202"/>
    <stop offset="100%" stop-color="#020202"/>
  </linearGradient>

  <radialGradient id="redGlow">
    <stop offset="0%" stop-color="#d00000" stop-opacity=".30"/>
    <stop offset="45%" stop-color="#800000" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="redLine">
    <stop offset="0%" stop-color="#3d0000" stop-opacity="0"/>
    <stop offset="50%" stop-color="#d00000"/>
    <stop offset="100%" stop-color="#3d0000" stop-opacity="0"/>
  </linearGradient>

  <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
    <path d="M70 0H0V70" fill="none" stroke="#8b0000" stroke-opacity=".10"/>
  </pattern>

  <pattern id="scan" width="1600" height="8" patternUnits="userSpaceOnUse">
    <rect width="1600" height="3" fill="#fff" opacity=".025"/>
    <rect y="4" width="1600" height="4" fill="#000" opacity=".30"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="strongGlow">
    <feGaussianBlur stdDeviation="18" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>

    .mono {
      font-family: "Courier New", monospace;
    }

    .title {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      letter-spacing: 22px;
    }

    @keyframes pulse {
      0%,100% { opacity:.25; }
      50% { opacity:1; }
    }

    @keyframes scan {
      from { transform:translateY(-700px); }
      to { transform:translateY(700px); }
    }

    @keyframes glitch {
      0%,88%,100% { transform:translate(0); }
      90% { transform:translate(-7px,2px); }
      92% { transform:translate(6px,-2px); }
      94% { transform:translate(-3px,0); }
    }

    @keyframes float {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-8px); }
    }

    @keyframes flicker {
      0%,18%,22%,65%,67%,100% { opacity:1; }
      20%,66% { opacity:.35; }
    }

    @keyframes particle {
      from {
        transform:translateY(30px);
        opacity:0;
      }
      40% { opacity:1; }
      to {
        transform:translateY(-120px);
        opacity:0;
      }
    }

    .pulse {
      animation:pulse 1.5s infinite;
    }

    .scan {
      animation:scan 8s linear infinite;
    }

    .glitch {
      animation:glitch 4s infinite;
    }

    .float {
      animation:float 4s ease-in-out infinite;
    }

    .flicker {
      animation:flicker 5s infinite;
    }

    .particle {
      animation:particle 4s linear infinite;
    }

  </style>

</defs>


<!-- ====================================================== -->
<!-- BACKGROUND -->
<!-- ====================================================== -->

<rect width="1600" height="700" fill="url(#bg)"/>

<ellipse
