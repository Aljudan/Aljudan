  </g>


  <!-- ===================================================== -->
  <!-- CENTRAL LABEL -->
  <!-- ===================================================== -->

  <g class="mono">

    <rect
      x="575"
      y="245"
      width="450"
      height="42"
      fill="#120000"
      stroke="#8B0000"
      stroke-opacity=".7"
    />

    <circle cx="602" cy="266" r="4" fill="#C00000" class="pulse"/>

    <text
      x="620"
      y="272"
      font-size="17"
      letter-spacing="5"
      fill="#D33"
    >
      404 // ENTER THE VOID
    </text>

  </g>


  <!-- ===================================================== -->
  <!-- MAIN TITLE -->
  <!-- ===================================================== -->

  <g class="glitch">

    <!-- red ghost -->
    <text
      x="800"
      y="435"
      text-anchor="middle"
      class="title"
      font-size="126"
      fill="#8B0000"
      opacity=".75"
      transform="translate(-8 0)"
