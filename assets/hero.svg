<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020202"/>
      <stop offset="55%" stop-color="#080303"/>
      <stop offset="100%" stop-color="#160000"/>
    </linearGradient>

```
<radialGradient id="redGlow" cx="70%" cy="50%" r="55%">
  <stop offset="0%" stop-color="#8b0000" stop-opacity=".55"/>
  <stop offset="45%" stop-color="#450000" stop-opacity=".25"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#450000"/>
  <stop offset="50%" stop-color="#ff1a1a"/>
  <stop offset="100%" stop-color="#450000"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="7" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="smallGlow">
  <feGaussianBlur stdDeviation="2" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Scanlines -->
<pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#ff0000" opacity=".06"/>
</pattern>

<!-- Noise-like dots -->
<pattern id="dots" width="80" height="80" patternUnits="userSpaceOnUse">
  <circle cx="5" cy="12" r="1" fill="#ff1a1a" opacity=".15"/>
  <circle cx="45" cy="30" r=".8" fill="#ffffff" opacity=".1"/>
  <circle cx="70" cy="65" r="1" fill="#ff1a1a" opacity=".12"/>
  <circle cx="20" cy="70" r=".7" fill="#ffffff" opacity=".08"/>
</pattern>
```

