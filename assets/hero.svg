<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
  <defs>

```
<!-- Background -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#050505"/>
  <stop offset="45%" stop-color="#0b0809"/>
  <stop offset="100%" stop-color="#050505"/>
</linearGradient>

<radialGradient id="redAura" cx="50%" cy="48%" r="55%">
  <stop offset="0%" stop-color="#8b0000" stop-opacity=".28"/>
  <stop offset="45%" stop-color="#480000" stop-opacity=".12"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#650000"/>
  <stop offset="50%" stop-color="#ff2020"/>
  <stop offset="100%" stop-color="#650000"/>
</linearGradient>

<linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ff1a1a" stop-opacity=".9"/>
  <stop offset="100%" stop-color="#ff1a1a" stop-opacity="0"/>
</linearGradient>

<!-- Grid -->
<pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse">
  <path d="M55 0H0V55" fill="none" stroke="#8b0000" stroke-opacity=".10"/>
</pattern>

<!-- Scanlines -->
<pattern id="scanlines" width="100%" height="8" patternUnits="userSpaceOnUse">
  <rect width="100%" height="1" fill="#ff2020" opacity=".045"/>
</pattern>

<!-- Glow -->
<filter id="glow">
  <feGaussianBlur stdDeviation="7" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="smallGlow">
  <feGaussianBlur stdDeviation="2.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Clip -->
<clipPath id="screen">
  <rect x="18" y="18" width="1564" height="684" rx="12"/>
</clipPath>

<!-- Animations -->
<style>
  .mono {
    font-family: "Courier New", monospace;
    letter-spacing: 2px;
  }

  .title {
    font-family: "Arial Black", "Arial", sans-serif;
    font-weight: 900;
    letter-spacing: 20px;
  }

  .blink {
    animation: blink 1.15s steps(2, start) infinite;
  }

  .pulse {
    animation: pulse 2.8s ease-in-out infinite;
  }

  .flicker {
    animation: flicker 4s infinite;
  }

  .scanMove {
    animation: scanMove 5s linear infinite;
  }

  .float {
    animation: float 4s ease-in-out infinite;
  }

  .glitchA {
    animation: glitchA 3.5s infinite;
  }

  .glitchB {
    animation: glitchB 4.1s infinite;
  }

  .particle {
    animation: particle 4s linear infinite;
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    46%, 100% { opacity: .15; }
  }

  @keyframes pulse {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
  }

  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: .35; }
    94% { opacity: 1; }
    96% { opacity: .55; }
    97% { opacity: 1; }
  }

  @keyframes scanMove {
    from { transform: translateY(-20px); }
    to { transform: translateY(740px); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes glitchA {
    0%, 88%, 100% {
      transform: translate(0,0);
      opacity: 0;
    }
    89% {
      transform: translate(-8px,2px);
      opacity: .65;
    }
    90% {
      transform: translate(7px,-2px);
      opacity: .35;
    }
    91% {
      transform: translate(-3px,1px);
      opacity: 0;
    }
  }

  @keyframes glitchB {
    0%, 91%, 100% {
      transform: translate(0,0);
      opacity: 0;
    }
    92% {
      transform: translate(8px,-1px);
      opacity: .55;
    }
    93% {
      transform: translate(-5px,2px);
      opacity: .3;
    }
    94% {
      transform: translate(0,0);
      opacity: 0;
    }
  }

  @keyframes particle {
    0% {
      transform: translateY(20px);
      opacity: 0;
    }
    15% {
      opacity: .8;
    }
    85% {
      opacity: .8;
    }
    100% {
      transform: translateY(-90px);
      opacity: 0;
    }
  }
</style>
