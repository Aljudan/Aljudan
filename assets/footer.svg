<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff003c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff003c"/>
      <stop offset="1" stop-color="#ff003c" stop-opacity="0"/>
    </linearGradient>

```
<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<style>
  .blink {
    animation: blink 1.5s steps(2,end) infinite;
  }

  .pulse {
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes blink {
    50% { opacity: .25; }
  }

  @keyframes pulse {
    50% { opacity: .45; }
  }

  text {
    font-family: monospace;
    letter-spacing: 3px;
  }
</style>
