<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#100307"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>

```
<linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff003c"/>
  <stop offset="0.5" stop-color="#ff174f"/>
  <stop offset="1" stop-color="#780019"/>
</linearGradient>

<radialGradient id="glow">
  <stop offset="0" stop-color="#ff003c" stop-opacity="0.3"/>
  <stop offset="1" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>

<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#ff003c" stroke-opacity="0.08"/>
</pattern>

<pattern id="scan" width="1" height="8" patternUnits="userSpaceOnUse">
  <rect width="1" height="4" fill="#fff" opacity="0.025"/>
</pattern>

<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<style>
  .blink {
    animation: blink 1.4s steps(2,end) infinite;
  }

  .pulse {
    animation: pulse 2s ease-in-out infinite;
  }

  .scan {
    animation: scan 5s linear infinite;
  }

  .bar {
    animation: bar 2.8s ease-in-out infinite;
    transform-origin: left center;
  }

  @keyframes blink {
    50% { opacity: .25; }
  }

  @keyframes pulse {
    50% { opacity: .45; }
  }

  @keyframes scan {
    from { transform: translateY(-430px); }
    to { transform: translateY(430px); }
  }

  @keyframes bar {
    0%,100% { transform: scaleX(.72); }
    50% { transform: scaleX(1); }
  }

  text {
    font-family: monospace;
    letter-spacing: 2px;
  }
</style>
```

