  .blink {
    animation: blink 2s infinite;
  }

  .pulse {
    animation: pulse 2s infinite;
  }

  @keyframes blink {
    0%,45%,100% { opacity:1; }
    47%,49% { opacity:.15; }
  }

  @keyframes pulse {
    0%,100% { opacity:.4; }
    50% { opacity:1; }
  }
</style>
