<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650">
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#180008"/>
      <stop offset=".45" stop-color="#080004"/>
      <stop offset="1" stop-color="#010101"/>
    </radialGradient>

```
<linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#700016"/>
  <stop offset=".5" stop-color="#ff003c"/>
  <stop offset="1" stop-color="#700016"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="6" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="soft">
  <feGaussianBlur stdDeviation="25"/>
</filter>

<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
  <path d="M50 0H0V50"
        fill="none"
        stroke="#ff003c"
        stroke-opacity=".07"/>
</pattern>

<style>
  .spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 18s linear infinite;
  }

  .reverse {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 12s linear infinite reverse;
  }

  .float {
    animation: float 3s ease-in-out infinite;
  }

  .flicker {
    animation: flicker 2.5s steps(2,end) infinite;
  }

  .blink {
    animation: blink 1.2s steps(2,end) infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes float {
    50% { transform: translateY(-10px); }
  }

  @keyframes flicker {
    0%,100% { opacity: 1; }
    48% { opacity: .75; }
    50% { opacity: .25; }
    52% { opacity: .9; }
  }

  @keyframes blink {
    50% { opacity: .2; }
  }

  text {
    font-family: monospace;
    letter-spacing: 2px;
  }
</style>
```

  </defs>

  <!-- BACKGROUND -->

  <rect width="1600" height="650" fill="url(#space)"/>
  <rect width="1600" height="650" fill="url(#grid)"/>

