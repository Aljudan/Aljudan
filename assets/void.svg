<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420">

  <defs>

```
<radialGradient id="void">
  <stop offset="0" stop-color="#45000f"/>
  <stop offset=".5" stop-color="#100003"/>
  <stop offset="1" stop-color="#020202"/>
</radialGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge>
    <feMergeNode in="b"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<style>
  .m {
    font-family:"Courier New",monospace;
    letter-spacing:4px;
  }

  .r { fill:#ff1744; }
  .w { fill:#eeeeee; }
  .d { fill:#6b1a2c; }

  .rotate {
    transform-box:fill-box;
    transform-origin:center;
    animation:rotate 15s linear infinite;
  }

  .reverse {
    transform-box:fill-box;
    transform-origin:center;
    animation:reverse 9s linear infinite;
  }

  .blink {
    animation:blink 2s infinite;
  }

  @keyframes rotate {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }

  @keyframes reverse {
    from { transform:rotate(360deg); }
    to { transform:rotate(0deg); }
  }

  @keyframes blink {
    0%,45%,100% {opacity:1;}
    47%,49% {opacity:.15;}
  }
</style>
```

  </defs>

  <rect width="1600" height="420" fill="#020202"/>

<rect x="20" y="20" width="1560" height="380"
     fill="url(#void)"
     stroke="#4c0917"/>

