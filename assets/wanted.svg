<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <radialGradient id="bg">
      <stop offset="0" stop-color="#170306"/>
      <stop offset=".6" stop-color="#080102"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>

```
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#19070a"/>
  <stop offset=".5" stop-color="#0b0305"/>
  <stop offset="1" stop-color="#180407"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="soft">
  <feGaussianBlur stdDeviation="22"/>
</filter>

<pattern id="scan" width="1" height="8" patternUnits="userSpaceOnUse">
  <rect width="1" height="3" fill="#fff" opacity=".025"/>
</pattern>

<style>
  .flicker {
    animation: flicker 2s steps(2,end) infinite;
  }

  .blink {
    animation: blink 1.3s steps(2,end) infinite;
  }

  .float {
    animation: float 3s ease-in-out infinite;
  }

  @keyframes flicker {
    0%,100% { opacity: 1; }
    45% { opacity: .8; }
    48% { opacity: .2; }
    50% { opacity: 1; }
  }

  @keyframes blink {
    50% { opacity: .2; }
  }

  @keyframes float {
    50% { transform: translateY(-5px); }
  }

  text {
    font-family: monospace;
    letter-spacing: 3px;
  }
</style>
```

