<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Analytics dashboard: player stats and learning progress">
  <defs>
    <linearGradient id="db-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#990000"/>
      <stop offset="1" stop-color="#FF0033"/>
    </linearGradient>
    <linearGradient id="db-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="1192" height="392" rx="18" fill="url(#db-card)" stroke="#FF0033" stroke-width="2"/>
  <rect x="4" y="4" width="1192" height="52" rx="18" fill="#FF0033" opacity="0.12"/>
  <line x1="4" y1="56" x2="1196" y2="56" stroke="#FF0033" stroke-width="1" opacity="0.5"/>

  <!-- title bar -->
  <circle cx="34" cy="30" r="7" fill="#FF0033"/>
  <circle cx="56" cy="30" r="7" fill="#FF0033" opacity="0.55"/>
  <circle cx="78" cy="30" r="7" fill="#FF0033" opacity="0.25"/>
  <text x="104" y="38" font-family="monospace" font-size="19" font-weight="bold" letter-spacing="2" fill="#ffffff">ANALYTICS — LOCAL ARCADE DASHBOARD</text>
  <rect x="1010" y="16" width="150" height="28" rx="14" fill="#FF0033"/>
  <text x="1085" y="35" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">OFFLINE ●</text>

  <!-- ===== LEFT: stat tiles ===== -->
  <g font-family="monospace">
    <text x="48" y="96" font-size="15" letter-spacing="3" fill="#FF4D5E">► PLAYER STATS</text>

    <!-- LEVEL -->
    <rect x="48" y="112" width="248" height="104" rx="12" fill="#161616" stroke="#333333" stroke-width="1"/>
    <rect x="48" y="112" width="248" height="5" rx="2" fill="#FF0033"/>
    <text x="172" y="162" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">01</text>
    <text x="172" y="192" text-anchor="middle" font-size="14" letter-spacing="2" fill="#888888">♥ LEVEL</text>

    <!-- REPOS -->
    <rect x="312" y="112" width="248" height="104" rx="12" fill="#161616" stroke="#333333" stroke-width="1"/>
    <rect x="312" y="112" width="248" height="5" rx="2" fill="#FF0033"/>
    <text x="436" y="162" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">01</text>
    <text x="436" y="192" text-anchor="middle" font-size="14" letter-spacing="2" fill="#888888">♦ PUBLIC REPOS</text>

    <!-- FOLLOWERS -->
    <rect x="48" y="228" width="248" height="104" rx="12" fill="#161616" stroke="#333333" stroke-width="1"/>
    <rect x="48" y="228" width="248" height="5" rx="2" fill="#FF0033" opacity="0.6"/>
    <text x="172" y="278" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">00</text>
    <text x="172" y="308" text-anchor="middle" font-size="14" letter-spacing="2" fill="#888888">♣ FOLLOWERS</text>

    <!-- STARS -->
    <rect x="312" y="228" width="248" height="104" rx="12" fill="#161616" stroke="#333333" stroke-width="1"/>
    <rect x="312" y="228" width="248" height="5" rx="2" fill="#FF0033" opacity="0.6"/>
    <text x="436" y="278" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">00</text>
    <text x="436" y="308" text-anchor="middle" font-size="14" letter-spacing="2" fill="#888888">♠ STARS EARNED</text>
  </g>

  <!-- divider -->
  <line x1="600" y1="76" x2="600" y2="340" stroke="#333333" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- ===== RIGHT: learning progress ===== -->
  <g font-family="monospace">
    <text x="640" y="96" font-size="15" letter-spacing="3" fill="#FF4D5E">► LEARNING PROGRESS</text>

    <text x="640" y="134" font-size="15" fill="#cccccc">HTML / CSS</text>
    <text x="1130" y="134" text-anchor="end" font-size="15" font-weight="bold" fill="#FF4D5E">75%</text>
    <rect x="640" y="144" width="490" height="16" rx="8" fill="#222222"/>
    <rect x="640" y="144" width="368" height="16" rx="8" fill="url(#db-bar)"/>

    <text x="640" y="196" font-size="15" fill="#cccccc">JavaScript</text>
    <text x="1130" y="196" text-anchor="end" font-size="15" font-weight="bold" fill="#FF4D5E">55%</text>
    <rect x="640" y="206" width="490" height="16" rx="8" fill="#222222"/>
    <rect x="640" y="206" width="270" height="16" rx="8" fill="url(#db-bar)"/>

    <text x="640" y="258" font-size="15" fill="#cccccc">TypeScript</text>
    <text x="1130" y="258" text-anchor="end" font-size="15" font-weight="bold" fill="#FF4D5E">40%</text>
    <rect x="640" y="268" width="490" height="16" rx="8" fill="#222222"/>
    <rect x="640" y="268" width="196" height="16" rx="8" fill="url(#db-bar)"/>

    <text x="640" y="322" font-size="13" fill="#666666">fresh account — angka naik seiring main ●</text>
  </g>

  <!-- footer note -->
  <line x1="48" y1="350" x2="1152" y2="350" stroke="#333333" stroke-width="1"/>
  <text x="600" y="376" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#777777">live stats diganti aset lokal — layanan github-readme-stats / streak / activity-graph / trophy sedang paused</text>
</svg>
