<svg xmlns="http://www.w3.org/2000/svg" width="740" height="110" viewBox="0 0 740 110" role="img" aria-label="Typing animation: welcome to my red arcade">
  <defs>
    <filter id="typ-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="740" height="110" fill="#00000000"/>

  <g text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="21" font-weight="600" filter="url(#typ-glow)">
    <text x="370" y="66" fill="#E0002B" opacity="0">▶ WELCOME TO MY RED ARCADE
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.22;0.25" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="370" y="66" fill="#E0002B" opacity="0">Black &amp; Red • Bandung, Indonesia
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.22;0.25" dur="12s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="370" y="66" fill="#E0002B" opacity="0">Play while you learn
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.22;0.25" dur="12s" begin="6s" repeatCount="indefinite"/>
    </text>
    <text x="370" y="66" fill="#E0002B" opacity="0">Beautify till you master it
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.22;0.25" dur="12s" begin="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor bar -->
  <rect x="180" y="80" width="380" height="3" fill="#E0002B" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
