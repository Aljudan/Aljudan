<svg xmlns="http://www.w3.org/2000/svg" width="740" height="110" viewBox="0 0 740 110" role="img" aria-label="Typing animation: welcome to my red arcade">
  <defs>
    <filter id="typ-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="740" height="110" fill="#00000000"/>

  <!-- 4 pesan, ganti tiap 4 detik (total siklus 16s).
       Pesan #1 base opacity=1 → tetap terlihat di renderer tanpa SMIL. -->
  <g text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="21" font-weight="700" letter-spacing="1.5" filter="url(#typ-glow)">
    <text x="370" y="66" opacity="1"><tspan fill="#FF0033">▶ </tspan><tspan fill="#F5F5F5">WELCOME TO MY RED ARCADE</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="370" y="66" opacity="0"><tspan fill="#F5F5F5">BLACK &amp; RED </tspan><tspan fill="#FF0033">•</tspan><tspan fill="#F5F5F5"> BANDUNG, INDONESIA </tspan><tspan fill="#FF0033">🇮🇩</tspan>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="4s" repeatCount="indefinite"/>
    </text>
    <text x="370" y="66" opacity="0"><tspan fill="#F5F5F5">PLAY </tspan><tspan fill="#FF0033">WHILE</tspan><tspan fill="#F5F5F5"> YOU LEARN</tspan>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="8s" repeatCount="indefinite"/>
    </text>
    <text x="370" y="66" opacity="0"><tspan fill="#F5F5F5">BEAUTIFY </tspan><tspan fill="#FF0033">TILL</tspan><tspan fill="#F5F5F5"> YOU MASTER IT</tspan>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- garis kursor berkedip -->
  <rect x="180" y="82" width="380" height="3" fill="#FF0033" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
