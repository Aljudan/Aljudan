<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500">
  <defs>

```
<!-- ================= BACKGROUND ================= -->

<radialGradient id="background" cx="50%" cy="35%" r="75%">
  <stop offset="0" stop-color="#160007"/>
  <stop offset=".35" stop-color="#090003"/>
  <stop offset="1" stop-color="#010101"/>
</radialGradient>

<radialGradient id="redAura">
  <stop offset="0" stop-color="#ff003c" stop-opacity=".22"/>
  <stop offset=".45" stop-color="#ff003c" stop-opacity=".07"/>
  <stop offset="1" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>

<linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#55000f" stop-opacity="0"/>
  <stop offset=".5" stop-color="#ff003c"/>
  <stop offset="1" stop-color="#55000f" stop-opacity="0"/>
</linearGradient>

<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#120207"/>
  <stop offset=".5" stop-color="#070104"/>
  <stop offset="1" stop-color="#100106"/>
</linearGradient>

<!-- ================= GRID ================= -->

<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path
    d="M40 0H0V40"
    fill="none"
    stroke="#ff003c"
    stroke-opacity=".055"
  />
</pattern>

<pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
  <path
    d="M10 0H0V10"
    fill="none"
    stroke="#ff003c"
    stroke-opacity=".025"
  />
</pattern>

<pattern id="scanlines" width="1" height="8" patternUnits="userSpaceOnUse">
  <rect width="1" height="3" fill="#ffffff" opacity=".025"/>
</pattern>

<!-- ================= GLOW ================= -->

<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="strongGlow">
  <feGaussianBlur stdDeviation="12" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="softGlow">
  <feGaussianBlur stdDeviation="35"/>
</filter>

<!-- ================= ANIMATION ================= -->

<style>
  .spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 18s linear infinite;
  }

  .reverseSpin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 11s linear infinite reverse;
  }

  .pulse {
    animation: pulse 2.5s ease-in-out infinite;
  }

  .fastPulse {
    animation: pulse 1.1s ease-in-out infinite;
  }

  .blink {
    animation: blink 1.4s steps(2,end) infinite;
  }

  .flicker {
    animation: flicker 3s steps(2,end) infinite;
  }

  .float {
    animation: float 4s ease-in-out infinite;
  }

  .scan {
    animation: scan 6s linear infinite;
  }

  .cursor {
    animation: blink 1s steps(2,end) infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes pulse {
    0%,100% {
      opacity: 1;
    }
    50% {
      opacity: .4;
    }
  }

  @keyframes blink {
    50% {
      opacity: .12;
    }
  }

  @keyframes flicker {
    0%,100% {
      opacity: 1;
    }
    48% {
      opacity: .75;
    }
    50% {
      opacity: .2;
    }
    52% {
      opacity: .9;
    }
  }

  @keyframes float {
    0%,100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-7px);
    }
  }

  @keyframes scan {
    from {
      transform: translateY(-1500px);
    }
    to {
      transform: translateY(1500px);
    }
  }

  text {
    font-family: monospace;
    letter-spacing: 2px;
  }
</style>
```

