name: Arcade Games

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  arcade:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # 🐍 Snake — makan kontribusi
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Aljudan
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF0033

      # 👻 Pac-Man — makan titik kontribusi
      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Aljudan

      # 🚀 Deploy semua SVG ke branch `output`
      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
